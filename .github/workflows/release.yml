name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and release notes
        run: |
          . ./scripts/common.ps1
          if ($env:GITHUB_REF_NAME -ne "v$AppVersion") { throw 'Tag must match Version.cs' }
          if (-not (Test-Path "docs/releases/$AppVersion.md")) { throw 'Release notes are missing' }
      - name: Test
        run: ./tests/run.ps1
      - name: Install pinned Inno Setup compiler
        run: ./scripts/install-build-tools.ps1
      - name: Build installer
        run: ./build.ps1 -Setup -ISCC ./.tools/inno/ISCC.exe
      - name: Package source and checksums
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifacts/releases
      - name: Create draft release and upload verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" artifacts/releases/* \
            --verify-tag --draft --title "SLink $version" \
            --notes-file "docs/releases/$version.md"
