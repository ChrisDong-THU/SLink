name: Feature request / 功能建议
description: Suggest a focused improvement / 提出改进建议
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 问题与使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
