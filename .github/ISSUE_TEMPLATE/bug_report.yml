name: Bug report / 问题反馈
description: Report a reproducible problem / 提交可复现的问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "请先查看 docs/troubleshooting.md。不要上传密码、订阅、节点凭据或未经脱敏的日志。"
  - type: input
    id: version
    attributes:
      label: SLink version / 版本
      placeholder: 1.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Windows build, Wi-Fi adapter/driver, proxy client and speaker model.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics / 已脱敏的诊断
